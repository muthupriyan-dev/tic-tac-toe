
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>

    <style>
      

      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #0f0c29;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }

      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        animation: float linear infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) scale(1);
          opacity: 0;
        }
      }

      .container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(12px, 3vw, 24px);
        padding: 20px;
      }

      .title {
        font-size: clamp(1.3rem, 5vw, 2rem);
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        animation: titlePulse 3s ease-in-out infinite;
      }

      @keyframes titlePulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.3);
        }
      }

      .status {
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.05em;
        min-height: 28px;
        text-align: center;
        transition: all 0.3s ease;
      }

      .status .player-x {
        color: #f5576c;
      }
      .status .player-o {
        color: #4facfe;
      }

      .scoreboard {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .score-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: clamp(6px, 2vw, 10px) clamp(10px, 4vw, 20px);
        text-align: center;
        backdrop-filter: blur(10px);
        min-width: clamp(60px, 18vw, 80px);
      }

      .score-card .label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .score-card.x-card .label {
        color: #f5576c;
      }
      .score-card.o-card .label {
        color: #4facfe;
      }
      .score-card.draw-card .label {
        color: #a8edea;
      }

      .score-card .score {
        font-size: 1.6rem;
        font-weight: 800;
        margin-top: 2px;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .score-card.x-card .score {
        color: #f5576c;
      }
      .score-card.o-card .score {
        color: #4facfe;
      }
      .score-card.draw-card .score {
        color: #a8edea;
      }

      .score-card .score.pop {
        animation: scorePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes scorePop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }

      .score-divider {
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.3);
        font-weight: 300;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 16px;
        backdrop-filter: blur(20px);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .cell {
        width: min(90px, 26vw);
        height: min(90px, 26vw);
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.5rem, 7vw, 2.5rem);
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
        user-select: none;
      }

      .cell::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .cell:hover:not(.taken) {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.3);
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .cell:hover:not(.taken)::before {
        opacity: 1;
      }

      .cell.taken {
        cursor: default;
      }

      .cell.x-cell {
        border-color: rgba(245, 87, 108, 0.5);
        background: rgba(245, 87, 108, 0.1);
        animation: cellPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .cell.x-cell .mark {
        color: #f5576c;
        animation: markDraw 0.3s ease forwards;
        text-shadow: 0 0 20px rgba(245, 87, 108, 0.8);
      }

      .cell.o-cell {
        border-color: rgba(79, 172, 254, 0.5);
        background: rgba(79, 172, 254, 0.1);
        animation: cellPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .cell.o-cell .mark {
        color: #4facfe;
        animation: markDraw 0.3s ease forwards;
        text-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
      }

      @keyframes cellPop {
        0% {
          transform: scale(0.8);
        }
        60% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes markDraw {
        0% {
          transform: scale(0) rotate(-20deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      .cell.winner {
        animation: winPulse 0.6s ease forwards;
      }

      .cell.winner.x-cell {
        background: rgba(245, 87, 108, 0.25);
        border-color: #f5576c;
        box-shadow:
          0 0 25px rgba(245, 87, 108, 0.5),
          inset 0 0 15px rgba(245, 87, 108, 0.2);
      }

      .cell.winner.o-cell {
        background: rgba(79, 172, 254, 0.25);
        border-color: #4facfe;
        box-shadow:
          0 0 25px rgba(79, 172, 254, 0.5),
          inset 0 0 15px rgba(79, 172, 254, 0.2);
      }

      @keyframes winPulse {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.15);
        }
        60% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1.05);
        }
      }

      .btn-group {
        display: flex;
        gap: 12px;
      }

      .btn {
        padding: 12px 28px;
        border: none;
        border-radius: 50px;
        font-family: "Poppins", sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: linear-gradient(135deg, #f5576c, #f093fb);
        color: white;
        box-shadow: 0 4px 20px rgba(245, 87, 108, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      .btn:active {
        transform: scale(0.97);
      }

      .win-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .win-overlay.show {
        opacity: 1;
        pointer-events: all;
      }

      .win-card {
        background: rgba(15, 12, 41, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 40px 60px;
        text-align: center;
        backdrop-filter: blur(30px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        transform: scale(0.8);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .win-overlay.show .win-card {
        transform: scale(1);
      }

      .win-emoji {
        font-size: 3.5rem;
        animation: bounce 0.6s ease infinite alternate;
      }

      @keyframes bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-10px);
        }
      }

      .win-text {
        font-size: 1.6rem;
        font-weight: 800;
        margin: 12px 0 6px;
        background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .win-sub {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 24px;
      }

      .confetti-piece {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 200;
        pointer-events: none;
        animation: confettiFall linear forwards;
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(0) rotate(0deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(105vh) rotate(720deg) scale(0.5);
          opacity: 0;
        }
      }

      .turn-indicator {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .turn-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        transition: all 0.3s ease;
      }

      .turn-dot.x {
        background: #f5576c;
        box-shadow: 0 0 10px #f5576c;
      }
      .turn-dot.o {
        background: #4facfe;
        box-shadow: 0 0 10px #4facfe;
      }
      .turn-dot.inactive {
        opacity: 0.2;
        box-shadow: none;
      }

      .brand {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 600;
      }

      @keyframes igPulse {
        0%, 100% { box-shadow: 0 4px 20px rgba(221,42,123,0.5), 0 0 30px rgba(129,52,175,0.3); }
        50% { box-shadow: 0 4px 30px rgba(221,42,123,0.8), 0 0 40px rgba(129,52,175,0.5); }
      }
    </style>

    <script>
      // Created by Mitali

      const particlesEl = document.getElementById("particles");

      // Prevent SoloLearn from crashing if #particles isn't ready yet
      if (particlesEl) {
        for (let i = 0; i < 30; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "%";
          p.style.animationDuration = Math.random() * 10 + 8 + "s";
          p.style.animationDelay = Math.random() * 10 + "s";
          p.style.width = p.style.height = Math.random() * 4 + 1 + "px";
          p.style.opacity = Math.random() * 0.5 + 0.1;
          particlesEl.appendChild(p);
        }
      }

      let board = Array(9).fill("");
      let currentPlayer = "X";
      let gameOver = false;
      let scores = { X: 0, O: 0, Draw: 0 };

      const winCombos = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      function handleClick(index) {
        if (board[index] !== "" || gameOver) return;

        board[index] = currentPlayer;
        renderCell(index);

        const winner = checkWinner();

        if (winner) {
          setTimeout(() => showWin(winner), 300);
          return;
        }

        if (board.every(cell => cell !== "")) {
          setTimeout(showDraw, 300);
          return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        updateStatus();
      }

      function renderCell(index) {
        const cell = document.querySelector(`[data-index="${index}"]`);
        if (!cell) return;

        cell.innerHTML = `<span class="mark">${currentPlayer}</span>`;
        cell.classList.add(
          "taken",
          currentPlayer === "X" ? "x-cell" : "o-cell"
        );
      }

      function checkWinner() {
        for (const [a, b, c] of winCombos) {
          if (
            board[a] &&
            board[a] === board[b] &&
            board[b] === board[c]
          ) {
            [a, b, c].forEach(i => {
              const cell = document.querySelector(
                `[data-index="${i}"]`
              );
              if (cell) cell.classList.add("winner");
            });

            return board[a];
          }
        }

        return null;
      }

      function updateStatus() {
        const status = document.getElementById("status");
        const dotX = document.getElementById("dotX");
        const dotO = document.getElementById("dotO");

        if (!status || !dotX || !dotO) return;

        if (currentPlayer === "X") {
          status.innerHTML = `<span class="player-x">X</span>'s Turn`;
          dotX.classList.remove("inactive");
          dotO.classList.add("inactive");
        } else {
          status.innerHTML = `<span class="player-o">O</span>'s Turn`;
          dotO.classList.remove("inactive");
          dotX.classList.add("inactive");
        }
      }

      function showWin(player) {
        gameOver = true;
        scores[player]++;
        updateScores(player);
        spawnConfetti();

        document.getElementById("winEmoji").textContent =
          player === "X" ? "🔥" : "✨";

        document.getElementById(
          "winText"
        ).textContent = `Player ${player} Wins!`;

        const subs = [
          "Amazing!",
          "Brilliant move!",
          "Unstoppable!",
          "Well played!",
        ];

        document.getElementById("winSub").textContent =
          subs[Math.floor(Math.random() * subs.length)];

        document.getElementById("status").innerHTML =
          player === "X"
            ? `<span class="player-x">X</span> Wins! 🎉`
            : `<span class="player-o">O</span> Wins! 🎉`;

        setTimeout(() => {
          document
            .getElementById("winOverlay")
            .classList.add("show");
        }, 100);
      }

      function showDraw() {
        gameOver = true;
        scores.Draw++;

        updateScores("Draw");

        document.getElementById("winEmoji").textContent = "🤝";
        document.getElementById("winText").textContent =
          "It's a Draw!";
        document.getElementById("winSub").textContent =
          "Nobody wins this round";

        document.getElementById("status").textContent =
          "Draw! 🤝";

        setTimeout(() => {
          document
            .getElementById("winOverlay")
            .classList.add("show");
        }, 100);
      }

      function updateScores(player) {
        const map = {
          X: "scoreX",
          O: "scoreO",
          Draw: "scoreDraw",
        };

        const el = document.getElementById(map[player]);

        if (!el) return;

        el.textContent = scores[player];

        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      }

      function spawnConfetti() {
        const colors = [
          "#f5576c",
          "#4facfe",
          "#f093fb",
          "#ffd700",
          "#a8edea",
          "#43e97b",
        ];

        for (let i = 0; i < 60; i++) {
          setTimeout(() => {
            const conf = document.createElement("div");
            conf.className = "confetti-piece";
            conf.style.left =
              Math.random() * 100 + "vw";
            conf.style.background =
              colors[
                Math.floor(Math.random() * colors.length)
              ];
            conf.style.borderRadius =
              Math.random() > 0.5 ? "50%" : "2px";
            conf.style.width =
              conf.style.height =
              Math.random() * 8 + 5 + "px";

            conf.style.animationDuration =
              Math.random() * 2 + 1.5 + "s";

            document.body.appendChild(conf);

            setTimeout(() => conf.remove(), 3000);
          }, i * 30);
        }
      }

      function closeOverlay() {
        document
          .getElementById("winOverlay")
          .classList.remove("show");

        resetGame();
      }

      function resetGame() {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameOver = false;

        document.querySelectorAll(".cell").forEach(cell => {
          cell.innerHTML = "";
          cell.className = "cell";
        });

        document
          .getElementById("winOverlay")
          .classList.remove("show");

        updateStatus();
      }

      function resetScore() {
        scores = { X: 0, O: 0, Draw: 0 };

        ["scoreX", "scoreO", "scoreDraw"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = "0";
        });

        resetGame();
      }

      updateStatus();
    </script>
  </body>
</html>
